[pytest]
testpaths = tests
python_files = test_*.py
markers =
    parquet_data: data quality checks for Parquet datasets
    smoke: lightweight availability and readability checks
    example: framework example tests, not part of the production DQ suite
    facility_name_min_time_spent_per_visit_date: checks for the facility-name dataset
    facility_type_avg_time_spent_per_visit_date: checks for the facility-type dataset
    patient_sum_treatment_cost_per_facility_type: checks for the patient-treatment-cost dataset
